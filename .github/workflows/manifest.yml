# Régénère data/anime/index.json à chaque ajout d'un .json d'anime
name: manifest
on: { push: { paths: ['data/anime/*.json'] } }
permissions: { contents: write }
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd data/anime && ls *.json | grep -v '^index.json$' | jq -R . | jq -s . > index.json
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && (git diff --cached --quiet || (git commit -m "maj manifest" && git push))
