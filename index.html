<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a16">
<title>Mini-Jeux entre potes</title>
<style>body{background:#0d0a16;color:#ece8f7;font-family:system-ui,sans-serif}.err{margin:16px;padding:14px;border:1px solid #f87171;border-radius:10px;color:#fca5a5;white-space:pre-wrap}</style>
<link rel="stylesheet" href="css/styles.css">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<header><b>Mini-Jeux</b><span id="roomtag"></span></header>
<main id="app"></main>
<div id="toast"></div>
<script>
const showErr=m=>{const a=document.getElementById('app');a.innerHTML='<div class="err">Erreur de chargement :\n'+m+'\n\nVérifie que index.html, css/, js/ et data/ sont au même niveau à la racine du dépôt, et ouvre F12 > Console.</div>'};
addEventListener('error',e=>showErr(e.message||'script introuvable'));
addEventListener('unhandledrejection',e=>showErr(String(e.reason&&e.reason.message||e.reason)));
</script>
<script type="module" src="js/main.js" onerror="showErr('js/main.js introuvable (404)')"></script>
</body>
</html>
